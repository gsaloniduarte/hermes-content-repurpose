  <title>Content Repurpose</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0; width: 1920px; height: 1080px;
      overflow: hidden; background-color: #0A0A0F; font-family: "Inter", sans-serif;
    }
    .scene { position: absolute; inset: 0; }

    /* Cena 1: Hook */
    #c1 { background: radial-gradient(ellipse at 50% 30%, #1A0A2E 0%, #0A0A0F 70%); }
    .accent-bar {
      width: 120px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, #FF2D75, #7B2FF7);
      margin-bottom: 1.5rem;
    }
    .title-big {
      font-size: 5.5rem; font-weight: 900; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FFFFFF 0%, #C0C0FF 40%, #FF2D75 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; line-height: 1.05; text-align: center;
    }
    .tagline {
      font-size: 1.3rem; color: rgba(255,255,255,0.5); margin-top: 1rem;
      letter-spacing: 0.08em; text-transform: uppercase; font-weight: 400;
    }
    .highlight { color: #FF2D75; font-weight: 700; }

    /* Cena 2: Processo */
    #c2 { background: #0A0A0F; }
    .step {
      display: flex; align-items: center; gap: 1rem;
      padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .step-num {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #FF2D75, #7B2FF7);
      color: #fff; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .step-title { font-size: 1.1rem; font-weight: 700; color: #fff; }

    /* Cena 3: Resultado */
    #c3 { background: radial-gradient(ellipse at 50% 70%, #1A0030 0%, #0A0A0F 70%); }
    .revenue {
      font-size: 5rem; font-weight: 900;
      background: linear-gradient(90deg, #FF2D75, #FF6B35, #7B2FF7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; text-align: center; margin-top: 2rem;
    }
    .revenue-label { font-size: 1.2rem; color: rgba(255,255,255,0.5); text-align: center; }

    .bg-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(10,10,15,0.8) 0%, rgba(10,10,15,0.2) 50%, rgba(10,10,15,0.8) 100%);
    }
    img.fit {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; top: 0; left: 0;
    }
